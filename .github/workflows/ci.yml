name: ShopWise CI
on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17', cache: maven}
      - run: mvn -B verify
        working-directory: src/backend
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: backend-coverage, path: src/backend/target/site/jacoco}
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: npm install
        working-directory: src/frontend
      - run: npm test -- --watch=false --code-coverage
        working-directory: src/frontend
      - run: npm run build
        working-directory: src/frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: frontend-coverage, path: src/frontend/coverage}
  images:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: {username: '${{ secrets.DOCKERHUB_USERNAME }}', password: '${{ secrets.DOCKERHUB_TOKEN }}'}
      - uses: docker/build-push-action@v6
        with: {context: ./src/backend, push: true, tags: '${{ vars.DOCKERHUB_REPOSITORY }}-backend:${{ github.ref_name }}'}
      - uses: docker/build-push-action@v6
        with: {context: ./src/frontend, push: true, tags: '${{ vars.DOCKERHUB_REPOSITORY }}-frontend:${{ github.ref_name }}'}
