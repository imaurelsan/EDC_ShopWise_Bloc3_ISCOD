apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-backend
spec:
  selector: {app: {{ .Release.Name }}-backend}
  ports: [{port: {{ .Values.service.backendPort }}, targetPort: 8080}]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-frontend
spec:
  type: NodePort
  selector: {app: {{ .Release.Name }}-frontend}
  ports: [{port: {{ .Values.service.frontendPort }}, targetPort: 80, nodePort: 30080}]
